[package]
name = "delegate-app"
version = "0.2.0"
description = "Menu-bar UI for the delegate-mcp local delegation daemon"
authors = ["Raphael Mitas"]
edition = "2021"
license = "MIT"

[lib]
name = "delegate_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = true
